name: StartupForge CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install Server Dependencies & Run Unit Tests
        run: |
          cd server
          npm ci || npm install
          npm test

      - name: Install Client Dependencies & Build Production Bundle
        run: |
          cd client
          npm ci || npm install
          npm run build
